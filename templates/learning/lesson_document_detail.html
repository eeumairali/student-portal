{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<script>(function(){function d(){var h=new Date().getHours();return h>=6&&h<19?"light":"dark"}try{if((localStorage.getItem("theme")||d())==="light"){document.documentElement.setAttribute("data-theme","light")}}catch(e){if(d()==="light"){document.documentElement.setAttribute("data-theme","light")}}})();</script>
<title>{{ front_matter.title }}{% if course %} · {{ course }}{% endif %}</title>
<link rel="stylesheet" href="{% static 'css/lesson-theme.css' %}">
{% if front_matter.accent %}
<style>:root{--accent:{{ front_matter.accent }};} .lesson-doc .dbtn{background:{{ front_matter.accent }}} .lesson-doc .fill{background:linear-gradient(90deg,{{ front_matter.accent }},var(--mint))}</style>
{% endif %}
</head>
<body class="lesson-doc">
<div class="wrap" style="padding-top:16px">
  <a href="{% url 'dashboard' %}" class="back-to-editor">&larr; back to dashboard</a>
  {% if locked %}
    <div class="tip preview-warnings">This lesson is locked — only you and your tutor can see it right now.</div>
  {% endif %}
</div>
{% include "learning/lesson/_document_body.html" %}
<script src="{% static 'js/lesson.js' %}" defer></script>
<script src="{% static 'js/theme-toggle.js' %}" defer></script>
</body>
</html>
