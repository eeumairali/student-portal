<div class="practice-actions">
  {% if node.has_solution %}
    <button type="button" class="hbtn">Reveal now</button>
  {% endif %}
  <button type="button" class="dbtn">Mark done</button>
</div>

{% if node.has_solution %}
  <div class="hint">
    <h4>Solution</h4>
    {{ node.solution_html|safe }}
  </div>
{% endif %}
