<div class="practice" data-task-id="{{ node.practice_id }}" {% if node.has_solution %}data-has-solution="1"{% endif %}>
  <div class="practice-top">
    <span class="practice-num">{{ node.index }}</span>
    <div class="practice-body">
      <span class="practice-label">Practice — try this on your own computer</span>
      <div class="practice-question">{{ node.question_html|safe }}</div>

      {% if node.expected %}
        <div class="expect"><b>Expected</b><pre class="mono">{{ node.expected }}</pre></div>
      {% endif %}

      {% include "learning/lesson/blocks/_practice_actions.html" %}
    </div>
  </div>
</div>
