{% load static %}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light">
    <title>{{ front_matter.title }}{% if course %} · {{ course }}{% endif %}</title>
    <link rel="stylesheet" href="{% static 'css/lesson-theme.css' %}">
    {% if front_matter.accent %}
    <style>:root{--accent:{{ front_matter.accent }};} .lesson-doc .dbtn{background:{{ front_matter.accent }}} .lesson-doc .fill{background:linear-gradient(90deg,{{ front_matter.accent }},var(--mint))}</style>
    {% endif %}
</head>
<body class="lesson-doc">
    {% include "learning/lesson/_document_body.html" %}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    theme: "base",
    fontFamily: "inherit",
    flowchart: { curve: "basis", htmlLabels: true },
    themeVariables: {
      primaryColor: "#E7F0FD",
      primaryTextColor: "#2B211A",
      primaryBorderColor: "#2D6FCF",
      lineColor: "#82695A",
      secondaryColor: "#FFF4E0",
      secondaryBorderColor: "#C97A12",
      tertiaryColor: "#EAF8EE",
      tertiaryBorderColor: "#2E9B4F",
      noteBkgColor: "#F6EAFB",
      noteBorderColor: "#A34AC9",
      fontSize: "16px"
    }
  });
</script>
<script src="{% static 'js/lesson.js' %}" defer></script>
</body>
</html>
