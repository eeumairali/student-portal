{% extends "base.html" %}
{% block title %}{{ user.username }} added{% endblock %}
{% block content %}
<h1 class="font-display text-3xl">{{ user.username }} is set up</h1>

<div class="card mt-6 border-amber-200 bg-amber-50 p-5">
  <p class="text-sm font-medium text-amber-900">This password is shown once — copy it now.</p>
  <p class="mt-3 rounded-lg bg-card p-3 font-mono text-sm">
    {{ user.username }} / {{ password }}
  </p>
</div>

<a href="{% url 'student_detail' user.id %}" class="btn-primary mt-6 inline-block">Go to {{ user.username }}'s page &rarr;</a>
{% endblock %}
